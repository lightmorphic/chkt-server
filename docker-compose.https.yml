# Optional add-on for putting CHKT on the public internet with a real
# domain and automatic HTTPS (Caddy gets and renews the certificate itself,
# no manual TLS setup). Use alongside the base file, not instead of it:
#
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
#
# Before running: edit Caddyfile and put your domain in it, and point that
# domain's DNS A record at this server first (Caddy needs to be reachable
# on the internet to get a certificate).
#
# With this overlay, everything goes through Caddy: the app's plain-HTTP
# port 8321 is no longer published on the host (Caddy reaches it over the
# internal compose network), so the login form and sync API can't be hit
# over unencrypted HTTP from outside. (The "!override" tag needs Docker
# Compose v2.24+; on older versions, remove the "ports" lines here AND in
# docker-compose.yml instead.)
#
# Public internet also means strangers can find a fresh install before you
# do — set CHKT_SETUP_TOKEN in .env before first start, then create your
# account at /setup?setup_token=<that value>.
services:
  chkt:
    environment:
      - CHKT_INSECURE_COOKIES=0
      - CHKT_SETUP_TOKEN=${CHKT_SETUP_TOKEN:-}
    ports: !override []

  caddy:
    image: caddy:2-alpine
    container_name: chkt-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - chkt

volumes:
  caddy_data:
  caddy_config:
