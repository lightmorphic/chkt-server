<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set up · CHKT</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="panel">
    <h1 style="font-size:1.5rem">Welcome to CHKT</h1>
    <p class="hint">First run, create the account you'll sign in with. There's only ever one.</p>
    {% if error %}<p class="msg bad">! {{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <input type="hidden" name="setup_token" value="{{ request.args.get('setup_token', '') }}">
      <label for="s-user">Username</label>
      <input id="s-user" name="username" autocomplete="username" required>
      <label for="s-pass">Password (12+ characters)</label>
      <input id="s-pass" name="password" type="password" autocomplete="new-password" minlength="12" required>
      <label for="s-confirm">Same password again</label>
      <input id="s-confirm" name="confirm" type="password" autocomplete="new-password" minlength="12" required>
      <p style="margin-bottom:0"><button class="btn-primary" type="submit">Create account</button></p>
    </form>
  </div>
</div>
</body>
</html>
