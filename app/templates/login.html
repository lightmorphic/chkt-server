<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Chkt</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="panel">
    <h1 style="font-size:1.5rem">Sign in to Chkt</h1>
    {% if error %}<p class="msg bad">! {{ error }}</p>{% endif %}
    <form method="post">
      <label for="l-user">Username</label>
      <input id="l-user" name="username" autocomplete="username" required>
      <label for="l-pass">Password</label>
      <input id="l-pass" name="password" type="password" autocomplete="current-password" required>
      <p style="margin-bottom:0"><button class="btn-primary" type="submit">Sign in</button></p>
    </form>
  </div>
</div>
</body>
</html>
