services:
  chkt:
    # Prebuilt image, so installing is a pull and no build tooling is
    # needed on the server (some stack managers cannot build at all).
    # Pin a version if you'd rather upgrade deliberately: CHKT_VERSION=1.1.10
    image: ghcr.io/lightmorphic/chkt-server:${CHKT_VERSION:-latest}
    container_name: chkt-server
    restart: unless-stopped
    # Nothing in CHKT needs elevated privileges: no privilege escalation
    # inside the container, and no Linux capabilities at all.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Host port only. Defaults to 8321; set CHKT_PORT in .env if that
      # port is taken or your host has its own convention. The container
      # always listens on 8321 inside.
      - "${CHKT_PORT:-8321}:8321"
    environment:
      # Best left alone. CHKT needs a secret key (it encrypts your saved
      # settings and signs your login cookie), and with none supplied it
      # generates one on first start and keeps it in the data folder,
      # alongside the database your backups already cover. Setting one in
      # .env instead means a deleted or tidied .env loses it, and with it
      # every stored setting. Only set CHKT_SECRET_KEY to carry an
      # existing key to a new server without its data folder.
      #
      # Read from CHKT_SECRET_KEY, not SECRET_KEY: compose lets the
      # surrounding environment win over .env, and some stack managers run
      # compose with a SECRET_KEY of their own set, which would silently
      # become CHKT's.
      - SECRET_KEY=${CHKT_SECRET_KEY:-}
      # Set to 1 in .env when serving plain HTTP inside a trusted network
      # (e.g. Tailscale, a home LAN); browsers refuse Secure cookies over
      # plain HTTP. Leave unset (0) once you're behind HTTPS.
      - CHKT_INSECURE_COOKIES=${CHKT_INSECURE_COOKIES:-0}
      # Your timezone, so reminder times here agree with the phone (e.g.
      # "9am" means the same 9am, not a UTC 9am). Set CHKT_TZ in .env,
      # e.g. CHKT_TZ=Europe/London. Defaults to UTC.
      - TZ=${CHKT_TZ:-UTC}
    volumes:
      # Your database, backups and secret key. Defaults to ./data beside
      # this file; set CHKT_DATA in .env to keep it elsewhere (an absolute
      # path is fine). Whatever you choose, keep it consistent — pointing
      # this somewhere new starts the app with an empty database while the
      # old one sits unused.
      - "${CHKT_DATA:-./data}:/data"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8321/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
