# Publish the container image on every version tag, so installing CHKT is a
# pull rather than a build. Tags here look like 1.1.10 (no leading "v").
name: Publish image

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # contents: write, not read — the last step publishes the GitHub
      # release for this tag. The in-app "new version available" banner
      # reads releases/latest, so a tag without a release is invisible to
      # every running install (versions 1.1.15–1.1.21 shipped that way and
      # nobody was offered them; backfilled since).
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 as well as amd64: plenty of home servers are Raspberry Pis.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # 1.1.10 -> :1.1.10, :1.1, :latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The GitHub release is what running installs actually watch. Body is
      # this version's CHANGELOG section, so the banner links to real notes.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          BODY=$(awk -v ver="[${TAG}]" '
            $0 ~ "^## \\[" { on = index($0, ver) > 0; next }
            on { print }' CHANGELOG.md)
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "${BODY:-See CHANGELOG.md}"
